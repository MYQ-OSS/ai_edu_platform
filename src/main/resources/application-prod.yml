# 生产环境配置文件
# ====================================

spring:
  # 数据源配置（MySQL 数据库连接）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 8.x 驱动类名
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql/ai_edu_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      # 数据库连接 URL 参数说明：
      # - useUnicode=true: 使用 Unicode 编码
      # - characterEncoding=utf-8: 字符集为 UTF-8
      # - useSSL=false: Docker 内部网络可关闭 SSL（如需开启改为 true）
      # - serverTimezone=Asia/Shanghai: 设置服务器时区为上海时间
      # - allowPublicKeyRetrieval=true: 允许公钥检索（解决 MySQL 8 认证问题）
    username: ${SPRING_DATASOURCE_USERNAME:root}  # 数据库用户名（从环境变量读取）
    password: ${SPRING_DATASOURCE_PASSWORD:MYQ1234567}  # 数据库密码（从环境变量读取）
    
    # HikariCP 连接池配置（生产环境优化）
    hikari:
      minimum-idle: 10  # 最小空闲连接数
      maximum-pool-size: 30  # 最大连接池大小
      idle-timeout: 300000  # 空闲连接超时时间（毫秒），默认10分钟
      max-lifetime: 1800000  # 连接最大生命周期（毫秒），默认30分钟
      connection-timeout: 30000  # 连接超时时间（毫秒），默认30秒
      connection-test-query: SELECT 1  # 连接测试查询
      pool-name: AiEduHikariCP  # 连接池名称

  # Jackson JSON 序列化配置
  jackson:
    time-zone: Asia/Shanghai  # 设置 JSON 日期输出的时区为东八区
    date-format: yyyy-MM-dd HH:mm:ss  # 日期格式化模式

# 服务器配置
server:
  port: 8080  # 生产环境服务端口（可通过环境变量或启动参数修改）

# 日志级别配置（生产环境以减少日志输出、提升性能为主）
logging:
  level:
    root: WARN  # 根日志级别为 WARN，只记录警告和错误信息
    top.mayiqin.ai_edu_platform: INFO  # 项目包日志级别为 INFO，记录关键业务日志
    com.baomidou.mybatisplus: INFO  # MyBatis-Plus 框架日志级别为 INFO
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
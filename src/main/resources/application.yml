# Spring Boot 应用主配置文件
# ====================================

spring:
  # 应用基础配置
  application:
    name: ai_edu_platform  # 应用名称，用于服务注册和日志标识
  profiles:
    active: dev  # 默认激活的开发环境配置
  servlet:
    multipart:
      max-file-size: 10MB  # 单个上传文件最大大小限制
      max-request-size: 10MB  # 整个请求最大大小限制（包含所有文件和表单数据）
  # Spring AI 配置（阿里云 DashScope 兼容 OpenAI 格式）
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY:sk-f4dffa83276644ecae2f7bd1ad283705}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: ${AI_DASHSCOPE_MODEL:qwen-plus}  # qwen-turbo(快)/qwen-plus(均衡)/qwen-max(高质量)
          temperature: ${AI_DASHSCOPE_TEMPERATURE:0.3}

# 服务器配置
server:
  port: 8080  # 应用启动端口
  servlet:
    context-path: /api  # 应用上下文路径，所有接口都会加上此前缀

# MyBatis-Plus 持久层框架配置
mybatis-plus:
  mapper-locations: classpath*:/mybatis/mapper/**/*.xml  # XML 映射文件扫描路径
  type-aliases-package: top.mayiqin.ai_edu_platform.entity.po  # 实体类别名包路径，XML 中可直接使用类名
  configuration:
    map-underscore-to-camel-case: true  # 开启数据库下划线字段到 Java 驼峰命名的自动转换
    cache-enabled: false  # 关闭 MyBatis 二级缓存（通常使用 Redis 等分布式缓存）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 使用 SLF4J 输出 SQL 日志
  global-config:
    db-config:
      id-type: auto  # 主键策略：数据库自增
      logic-delete-field: isDeleted  # 全局逻辑删除字段名（对应实体类属性名）
      logic-delete-value: 1  # 逻辑删除值（已删除）
      logic-not-delete-value: 0  # 逻辑未删除值

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: top.mayiqin.ai_edu_platform.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT配置
jwt:
  secret-key: ${JWT_SECRET_KEY:DaiMaDouDui_Secure_Key_2026_For_JWT} # JWT签名密钥（生产环境请通过环境变量注入）
  expiration: 3600000 # Token过期时间（毫秒），默认1小时

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info  # 暴露健康检查和基本信息端点
  endpoint:
    health:
      show-details: when-authorized  # 仅在授权时显示详细信息

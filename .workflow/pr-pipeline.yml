version: '1.0'
name: pr-pipeline
displayName: PRPipeline
stages:
  - stage: 
    name: compile
    displayName: 后端编译
    steps:
      - step: build@maven
        name: build_maven
        displayName: Maven 构建
        jdkVersion: 21
        mavenVersion: 3.6.3
        commands:
          - mvn -B clean package -Dmaven.test.skip=true
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./target
      - step: publish@general_artifacts
        name: publish_general_artifacts
        displayName: 上传后端制品
        dependArtifact: BUILD_ARTIFACT
        artifactName: ai-edu-backend
        dependsOn: build_maven
  - stage: 
    name: frontend-build
    displayName: 前端编译
    steps:
      - step: build@nodejs
        name: build_frontend
        displayName: Node.js 构建
        nodeVersion: 20.10.0
        commands:
          - cd ai_edu_platform_frontend
          - npm install --legacy-peer-deps
          - npm run build
        artifacts:
          - name: FRONTEND_ARTIFACT
            path:
              - ./ai_edu_platform_frontend/dist
      - step: publish@general_artifacts
        name: publish_frontend_artifacts
        displayName: 上传前端制品
        dependArtifact: FRONTEND_ARTIFACT
        artifactName: ai-edu-frontend
        dependsOn: build_frontend
triggers:
  pr:
    branches:
      include:
        - main

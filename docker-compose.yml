version: '3.8'

services:
  # 后端应用服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_edu_platform
    restart: always
    ports:
      - "8080:8080"
    environment:
      # 数据库配置（连接到现有 MySQL 容器）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_edu_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MYQ1234567}
      # AI 配置
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-sk-f4dffa83276644ecae2f7bd1ad283705}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL:-qwen-plus}
      AI_DASHSCOPE_TEMPERATURE: ${AI_DASHSCOPE_TEMPERATURE:-0.3}
      # JWT 配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-DaiMaDouDui_Secure_Key_2026_For_JWT}
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - myapp
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  backend_logs:
    driver: local

networks:
  myapp:
    external: true
